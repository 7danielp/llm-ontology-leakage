[project]
name = "llm-ontology-leakage"
version = "0.1.0"
description = "How Much Do Current LLMs Know About Public Ontologies?"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.2",
    "openai>=2.44.0",
    "python-dotenv>=1.2.2",
    "rdflib>=7.6.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
